services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    depends_on:
      qdrant:
        condition: service_started

  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: rag_ollama_puller
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    env_file:
      - .env
    environment:
      - OLLAMA_EMB_MODEL=${OLLAMA_EMB_MODEL}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Ollama service...';
      while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Downloading Embedding Model ($OLLAMA_EMB_MODEL)...';
      curl -X POST http://ollama:11434/api/pull -d '{\"model\": \"$OLLAMA_EMB_MODEL\"}';
      echo 'Downloading LLM Model ($OLLAMA_LLM_MODEL)...';
      curl -X POST http://ollama:11434/api/pull -d '{\"model\": \"$OLLAMA_LLM_MODEL\"}';
      echo 'Models initialization finished!';
      "

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_go_api
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      qdrant:
        condition: service_started
      ollama-model-puller:
        condition: service_completed_successfully

volumes:
  qdrant_data:
  ollama_data: